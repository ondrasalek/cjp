# Edge rate & connection limits per real client IP (10 MB shared memory ~ 160k IPs)
# Requests that carry an API key header get a higher edge limit, still per real client IP:
# nginx cannot tell a valid key from a made-up one (the Go API does, and answers 401), so a key
# header must never switch the edge limit off. An empty zone key means "not counted in this zone".
map $http_authorization $cjp_free_ip {
    default           $binary_remote_addr;
    "~*^Bearer cjp_"  "";
}
map $http_authorization $cjp_keyed_ip {
    default           "";
    "~*^Bearer cjp_"  $binary_remote_addr;
}
limit_req_zone  $cjp_free_ip  zone=cjp_api_limit:10m  rate=10r/s;
limit_req_zone  $cjp_keyed_ip zone=cjp_paid_limit:10m rate=100r/s;
limit_conn_zone $binary_remote_addr zone=cjp_conn_limit:10m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Who is the visitor? Production runs behind Cloudflare (proxied DNS) -> Coolify Traefik -> this
    # nginx. Cloudflare overwrites CF-Connecting-IP with the real visitor address, so that header is
    # the only trustworthy one; X-Forwarded-For can be extended by the client. It is accepted only
    # from the internal proxy network. The result ($remote_addr) keys the limits below and is passed
    # to the API as X-Real-IP, which is the only header the API trusts.
    # REQUIREMENT: the server must accept web traffic only from Cloudflare (firewall the origin to
    # Cloudflare's IP ranges, or use a Cloudflare Tunnel). Anyone who can reach the origin directly
    # can forge CF-Connecting-IP. If Cloudflare proxying is ever switched off, change this header.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    # Use Docker embedded DNS so container IP changes during rolling deploys never cause 502s
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Reject large request bodies & cap concurrent connections per IP
    client_max_body_size 64k;
    limit_conn cjp_conn_limit 20;
    limit_conn_status 429;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;

    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        add_header Retry-After 1 always;
        return 429 '{"error":"rate_limited","message":"Příliš mnoho požadavků – zkuste to prosím za okamžik."}';
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        limit_req zone=cjp_api_limit burst=40 nodelay;
        limit_req zone=cjp_paid_limit burst=300 nodelay;
        limit_req_status 429;

        set $api_upstream http://cjp-api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        set $api_upstream http://cjp-api:8080;
        proxy_pass $api_upstream/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /robots.txt {
        set $api_upstream http://cjp-api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sitemap.xml {
        set $api_upstream http://cjp-api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /sitemaps/ {
        set $api_upstream http://cjp-api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
