services:
  cjp-api:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8080"
    volumes:
      - cjp-data:/data
    environment:
      CJP_ADDR: ":8080"
      CJP_DB_PATH: "/data/cjp.db"
      CJP_RAW_DIR: "/data/raw"
      CJP_INCLUDE_GPL: "${CJP_INCLUDE_GPL:-true}"
      CJP_USE_HUNSPELL: "${CJP_USE_HUNSPELL:-true}"
      CJP_RATE_LIMIT_RPS: "${CJP_RATE_LIMIT_RPS:-5}"
      CJP_RATE_LIMIT_BURST: "${CJP_RATE_LIMIT_BURST:-30}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 300s
    restart: unless-stopped

  cjp-web:
    build:
      context: ./web
      dockerfile: Dockerfile
    expose:
      - "80"
    depends_on:
      cjp-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  cjp-data:
